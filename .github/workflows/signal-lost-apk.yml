name: Signal Lost APK

# Builds an installable debug APK of the game whenever the game changes.
# Download it from the run's "Artifacts" section and sideload it on your phone.
on:
  push:
    paths:
      - 'signal-lost/**'
      - '.github/workflows/signal-lost-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signal-lost
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install ImageMagick (icons and splash)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: npx cap add android

      - name: Patch project (portrait, fullscreen, icon, splash)
        run: bash scripts/prepare-android.sh

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: signal-lost/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk signal-lost-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: signal-lost-debug-apk
          path: signal-lost/signal-lost-debug.apk
          retention-days: 30
